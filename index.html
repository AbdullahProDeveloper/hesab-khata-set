<!DOCTYPE html>
<html lang="bn" x-data="erpSystem()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZ-PRO Enterprise ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {top: 50px; margin: 30px;}
        [x-cloak] { display: none !important; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; }
        .gradient-brand { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-72 bg-slate-900 text-white p-6 shrink-0 shadow-2xl">
        <div class="flex items-center gap-3 mb-12">
            <div class="p-2 bg-indigo-500 rounded-xl"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
            <h1 class="text-2xl font-bold tracking-tight">BIZ-PRO</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <template x-for="m in menu">
                <button @click="tab = m.id" 
                    :class="tab === m.id ? 'bg-indigo-600 shadow-indigo-500/20' : 'text-slate-400 hover:bg-slate-800'"
                    class="w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 shadow-lg">
                    <i :data-lucide="m.icon" class="w-5 h-5"></i>
                    <span class="font-semibold" x-text="m.name"></span>
                </button>
            </template>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Navbar -->
        <header class="h-20 bg-white border-b flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4 lg:hidden">
                <button class="p-2 bg-slate-100 rounded-lg"><i data-lucide="menu"></i></button>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800" x-text="menu.find(i => i.id === tab).name"></h2>
                <p class="text-xs text-slate-400">রিয়েল-টাইম ডুয়াল সিংক্রোনাইজড</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden md:block text-right">
                    <p class="text-sm font-bold text-slate-700">অ্যাডমিন প্যানেল</p>
                    <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest">● অনলাইন (Dual-Sync)</p>
                </div>
                <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center border-2 border-indigo-500 shadow-sm">
                    <i data-lucide="user" class="text-indigo-600"></i>
                </div>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            
            <!-- Dashboard -->
            <div x-show="tab === 'dashboard'" x-transition x-cloak>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="gradient-brand p-8 rounded-[2rem] text-white shadow-xl shadow-indigo-200">
                        <p class="opacity-80 text-sm font-medium">আজকের বিক্রি</p>
                        <h3 class="text-4xl font-bold mt-2">৳<span x-text="stats.dayTotal">0</span></h3>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                        <p class="text-slate-500 text-sm font-medium">আজকের লাভ</p>
                        <h3 class="text-4xl font-bold mt-2 text-emerald-600">৳<span x-text="stats.dayProfit">0</span></h3>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                        <p class="text-slate-500 text-sm font-medium">মোট বাকি (Due)</p>
                        <h3 class="text-4xl font-bold mt-2 text-rose-600">৳<span x-text="stats.totalDue">0</span></h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-3xl border shadow-sm">
                        <h4 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="package" class="text-orange-500"></i> স্টক অ্যালার্ট (কম পণ্য)</h4>
                        <div class="space-y-3">
                            <template x-for="p in products.filter(i => Number(i.Stock) < 10)">
                                <div class="flex justify-between items-center p-4 bg-orange-50 rounded-2xl border border-orange-100">
                                    <span class="font-bold text-slate-700" x-text="p.Name"></span>
                                    <span class="px-3 py-1 bg-white text-orange-600 rounded-full text-xs font-bold" x-text="'বাকি: ' + p.Stock"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- POS -->
            <div x-show="tab === 'pos'" x-transition x-cloak>
                <div class="flex flex-col lg:flex-row gap-8">
                    <div class="flex-1">
                        <div class="relative mb-6">
                            <i data-lucide="search" class="absolute left-4 top-4 text-slate-400"></i>
                            <input type="text" x-model="search" placeholder="পণ্যের নাম বা ক্যাটাগরি দিয়ে খুঁজুন..." 
                                class="w-full pl-12 pr-6 py-4 bg-white border-none shadow-md rounded-2xl focus:ring-4 focus:ring-indigo-100 transition outline-none">
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <template x-for="p in filtered()">
                                <div @click="addToCart(p)" class="bg-white p-4 rounded-3xl border border-slate-100 hover:border-indigo-500 hover:shadow-xl cursor-pointer transition active:scale-95 text-center">
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto mb-3 flex items-center justify-center font-bold">৳</div>
                                    <h5 class="font-bold text-sm text-slate-800 truncate" x-text="p.Name"></h5>
                                    <p class="text-indigo-600 font-bold mt-1 text-lg">৳<span x-text="p.SellPrice"></span></p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Cart -->
                    <div class="w-full lg:w-96">
                        <div class="bg-slate-900 rounded-[2.5rem] text-white p-8 sticky top-4 shadow-2xl">
                            <h4 class="text-xl font-bold mb-6 flex items-center gap-3"><i data-lucide="shopping-cart"></i> চেকআউট</h4>
                            <div class="space-y-4 mb-8 max-h-64 overflow-y-auto pr-2 custom-scroll">
                                <template x-for="(item, i) in cart">
                                    <div class="flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/10">
                                        <div class="flex-1 pr-2">
                                            <p class="font-bold text-sm truncate" x-text="item.Name"></p>
                                            <p class="text-xs text-indigo-400 font-bold" x-text="'৳' + item.SellPrice + ' x ' + item.qty"></p>
                                        </div>
                                        <button @click="cart.splice(i, 1)" class="text-rose-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                </template>
                            </div>
                            <div class="space-y-4">
                                <input type="text" x-model="customer.Name" placeholder="ক্রেতার নাম" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-indigo-500">
                                <input type="number" x-model="customer.Phone" placeholder="মোবাইল নম্বর" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-indigo-500">
                                <div class="border-t border-white/10 pt-4">
                                    <div class="flex justify-between text-2xl font-bold">
                                        <span>টোটাল:</span>
                                        <span class="text-indigo-400">৳<span x-text="total()"></span></span>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="number" x-model="paid" placeholder="জমা" class="w-full bg-white text-slate-900 rounded-xl p-3 font-bold">
                                    <div class="bg-rose-500/20 text-rose-400 rounded-xl p-3 text-center font-bold">বাকি: <span x-text="total() - paid"></span></div>
                                </div>
                                <button @click="checkout()" class="w-full gradient-brand py-5 rounded-2xl font-bold text-lg hover:scale-[1.02] transition active:scale-95 shadow-lg shadow-indigo-500/30">অর্ডার কনফার্ম করুন</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Nav (Mobile) -->
        <nav class="md:hidden bg-white border-t flex justify-around py-4">
            <template x-for="m in menu">
                <button @click="tab = m.id" :class="tab === m.id ? 'text-indigo-600' : 'text-slate-400'" class="flex flex-col items-center">
                    <i :data-lucide="m.icon" class="w-6 h-6"></i>
                </button>
            </template>
        </nav>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6geARsr2R_HS2QdghcCaDO5XeT24N9fk05Hz6u8yOZwj_OH98UiCHf8FFvPmEQccStQ/exec";

        function erpSystem() {
            return {
                tab: 'dashboard',
                search: '',
                menu: [
                    { id: 'dashboard', name: 'ওভারভিউ', icon: 'layout-dashboard' },
                    { id: 'pos', name: 'পয়েন্ট অফ সেল (POS)', icon: 'shopping-cart' },
                    { id: 'products', name: 'ইনভেন্টরি', icon: 'package' },
                    { id: 'customers', name: 'ক্রেতা ডাটা', icon: 'users' },
                    { id: 'reports', name: 'অ্যাকাউন্টিং', icon: 'pie-chart' }
                ],
                products: [],
                customers: [],
                stats: { dayTotal: 0, dayProfit: 0, totalDue: 0 },
                cart: [],
                customer: { Name: '', Phone: '' },
                paid: 0,

                async init() {
                    lucide.createIcons();
                    this.syncData();
                },

                async syncData() {
                    try {
                        const res = await fetch(`${API_URL}?action=sync`);
                        const data = await res.json();
                        this.products = data.products;
                        this.customers = data.customers;
                        this.stats = data.stats;
                    } catch (e) { console.error("Sync Failed"); }
                },

                filtered() {
                    return this.products.filter(p => p.Name.toLowerCase().includes(this.search.toLowerCase()));
                },

                addToCart(p) {
                    let item = this.cart.find(i => i.Name === p.Name);
                    if (item) item.qty++;
                    else this.cart.push({...p, qty: 1});
                },

                total() {
                    return this.cart.reduce((s, i) => s + (i.SellPrice * i.qty), 0);
                },

                async checkout() {
                    if (this.cart.length === 0 || !this.customer.Phone) return alert("তথ্য অসম্পূর্ণ!");
                    
                    const res = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: 'checkout',
                            data: {
                                items: this.cart,
                                customer: this.customer,
                                subtotal: this.total(),
                                discount: 0,
                                total: this.total(),
                                paid: this.paid,
                                due: this.total() - this.paid
                            }
                        })
                    });
                    
                    const result = await res.json();
                    if (result.status === 'success') {
                        alert("অর্ডার সম্পন্ন! ইনভয়েস ID: " + result.invID);
                        this.cart = [];
                        this.customer = { Name: '', Phone: '' };
                        this.paid = 0;
                        this.syncData();
                    }
                }
            }
        }
    </script>
</body>
</html>
