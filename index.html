<!DOCTYPE html>
<html lang="bn" x-data="erpApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise BizPro | Dual Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f4f7fe; }
        .tab-active { background: #4f46e5; color: white; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="h-20 shrink-0 bg-white border-b px-6 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-2xl text-white"><i data-lucide="zap"></i></div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">BizPro <span class="text-indigo-600">Enterprise</span></h1>
        </div>
        <div class="flex gap-4">
            <button @click="sync()" class="p-3 bg-indigo-50 rounded-2xl text-indigo-600 hover:bg-indigo-100"><i data-lucide="refresh-ccw" :class="loading && 'animate-spin'"></i></button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-32">
        
        <!-- Dashboard -->
        <div x-show="tab === 'dashboard'" x-transition x-cloak>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm border-indigo-100">
                    <p class="text-xs font-bold text-slate-400 uppercase">আজকের মোট বিক্রি</p>
                    <h2 class="text-3xl font-bold mt-2">৳<span x-text="stats.dayTotal">0</span></h2>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm border-indigo-100">
                    <p class="text-xs font-bold text-emerald-500 uppercase">আজকের নীট লাভ</p>
                    <h2 class="text-3xl font-bold mt-2 text-emerald-600">৳<span x-text="stats.dayProfit">0</span></h2>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm border-indigo-100">
                    <p class="text-xs font-bold text-rose-500 uppercase">মোট বাকি (Due)</p>
                    <h2 class="text-3xl font-bold mt-2 text-rose-600">৳<span x-text="stats.totalDue">0</span></h2>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm border-indigo-100">
                    <p class="text-xs font-bold text-amber-500 uppercase">আজকের খরচ</p>
                    <h2 class="text-3xl font-bold mt-2 text-amber-600">৳<span x-text="stats.dayExp">0</span></h2>
                </div>
            </div>

            <!-- Visual Analytics (Demo) -->
            <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm mb-8">
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="bar-chart-3"></i> বিক্রয় রিপোর্ট</h3>
                <canvas id="salesChart" height="100"></canvas>
            </div>
        </div>

        <!-- POS System -->
        <div x-show="tab === 'pos'" x-transition x-cloak class="space-y-6">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-5 top-5 text-slate-400 group-focus-within:text-indigo-500 transition"></i>
                <input type="text" x-model="search" placeholder="পণ্যের নাম দিয়ে সার্চ করুন..." 
                    class="w-full pl-14 pr-6 py-5 bg-white border-none rounded-3xl shadow-lg focus:ring-4 focus:ring-indigo-100 transition outline-none text-lg">
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <template x-for="p in filtered()">
                    <div @click="addToCart(p)" class="bg-white p-5 rounded-[2rem] border border-slate-100 hover:border-indigo-500 hover:shadow-xl cursor-pointer transition active:scale-95 text-center relative overflow-hidden group">
                        <div class="w-12 h-12 bg-indigo-50 rounded-2xl mx-auto mb-3 flex items-center justify-center text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-all"><i data-lucide="package"></i></div>
                        <h4 class="font-bold text-sm text-slate-700 truncate" x-text="p.Name"></h4>
                        <p class="text-indigo-600 font-black mt-2 text-lg">৳<span x-text="p.SellPrice"></span></p>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">স্টক: <span x-text="p.Stock"></span></p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Expense Management -->
        <div x-show="tab === 'expense'" x-transition x-cloak class="space-y-6">
            <button @click="showModal('expense')" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-bold text-lg">+ নতুন খরচ যোগ করুন</button>
            <div class="space-y-3">
                <template x-for="e in expenses">
                    <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center font-bold">৳</div>
                            <div>
                                <p class="font-bold text-slate-700" x-text="e.Reason"></p>
                                <p class="text-[10px] text-slate-400 uppercase tracking-widest" x-text="e.Category"></p>
                            </div>
                        </div>
                        <p class="font-black text-rose-500">৳<span x-text="e.Amount"></span></p>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Cart Floating Bar (POS Only) -->
    <div x-show="tab === 'pos' && cart.length > 0" class="fixed bottom-32 left-6 right-6 z-50">
        <button @click="openCheckout()" class="w-full bg-slate-900 text-white p-6 rounded-[2rem] shadow-2xl flex justify-between items-center animate-bounce">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-500 w-10 h-10 rounded-full flex items-center justify-center font-black" x-text="cart.length"></div>
                <span class="font-bold text-lg">পণ্য যোগ করা হয়েছে</span>
            </div>
            <span class="text-2xl font-black italic">মোট: ৳<span x-text="total()"></span> →</span>
        </button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 inset-x-0 h-24 glass border-t flex justify-around items-center px-6 z-50 safe-bottom">
        <template x-for="m in menu">
            <button @click="tab = m.id" :class="tab === m.id && 'tab-active'" class="flex flex-col items-center gap-1.5 p-4 transition-all duration-300">
                <i :data-lucide="m.icon" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest" x-text="m.name"></span>
            </button>
        </template>
    </nav>

    <!-- Global Loading Overlay -->
    <div x-show="loading" class="fixed inset-0 z-[100] bg-white/90 flex flex-col items-center justify-center backdrop-blur-xl">
        <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-6 text-indigo-600 font-black tracking-widest uppercase">সিংক্রোনাইজিং...</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6geARsr2R_HS2QdghcCaDO5XeT24N9fk05Hz6u8yOZwj_OH98UiCHf8FFvPmEQccStQ/exec";

        function erpApp() {
            return {
                tab: 'dashboard', loading: false, search: '',
                menu: [
                    {id: 'dashboard', name: 'হোম', icon: 'layout-dashboard'},
                    {id: 'pos', name: 'বিক্রি', icon: 'shopping-bag'},
                    {id: 'inventory', name: 'স্টক', icon: 'package'},
                    {id: 'expense', name: 'খরচ', icon: 'wallet'},
                    {id: 'customers', name: 'ক্রেতা', icon: 'users'}
                ],
                products: [], customers: [], expenses: [],
                stats: { dayTotal: 0, dayProfit: 0, totalDue: 0, dayExp: 0 },
                cart: [],

                async init() {
                    lucide.createIcons();
                    await this.sync();
                    this.renderChart();
                },

                async sync() {
                    this.loading = true;
                    try {
                        const res = await fetch(`${API_URL}?action=sync`);
                        const data = await res.json();
                        this.products = data.products;
                        this.customers = data.customers;
                        this.expenses = data.expenses;
                        this.stats = data.stats;
                        lucide.createIcons();
                    } catch(e) { Swal.fire('Error', 'সার্ভারে কানেক্ট করা যায়নি!', 'error'); }
                    this.loading = false;
                },

                filtered() { return this.products.filter(p => p.Name.toLowerCase().includes(this.search.toLowerCase())); },
                addToCart(p) { this.cart.push({...p, qty: 1}); },
                total() { return this.cart.reduce((s, i) => s + Number(i.SellPrice), 0); },

                async openCheckout() {
                    const { value: formValues } = await Swal.fire({
                        title: 'চেকআউট - ডুয়াল সেভ',
                        html: `<input id="swal-phone" class="swal2-input" placeholder="ফোন নম্বর">` +
                              `<input id="swal-paid" type="number" class="swal2-input" placeholder="জমা টাকা">`,
                        focusConfirm: false,
                        showCancelButton: true,
                        preConfirm: () => ({
                            phone: document.getElementById('swal-phone').value,
                            paid: document.getElementById('swal-paid').value
                        })
                    });

                    if (formValues) {
                        this.loading = true;
                        const res = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'checkout',
                                data: { items: this.cart, phone: formValues.phone, total: this.total(), paid: formValues.paid, due: this.total() - formValues.paid }
                            })
                        });
                        await this.sync();
                        this.cart = [];
                        Swal.fire('সফল!', 'দুটি শিটে ডাটা সেভ হয়েছে।', 'success');
                    }
                },

                async showModal(type) {
                    if(type === 'expense') {
                        const { value: exp } = await Swal.fire({
                            title: 'খরচ যোগ করুন',
                            html: `<input id="e-res" class="swal2-input" placeholder="কারণ">` +
                                  `<input id="e-amt" type="number" class="swal2-input" placeholder="টাকা">`,
                            preConfirm: () => ({ reason: document.getElementById('e-res').value, amount: document.getElementById('e-amt').value, cat: 'General' })
                        });
                        if(exp) {
                            this.loading = true;
                            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addExpense', data: exp })});
                            await this.sync();
                        }
                    }
                },

                renderChart() {
                    const ctx = document.getElementById('salesChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['শনি', 'রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহঃ', 'শুক্র'],
                            datasets: [{
                                label: 'বিক্রি',
                                data: [1200, 1900, 3000, 5000, 2000, 3000, 4500],
                                borderColor: '#4f46e5',
                                tension: 0.4,
                                fill: true,
                                backgroundColor: 'rgba(79, 70, 229, 0.1)'
                            }]
                        },
                        options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                    });
                }
            }
        }
    </script>
</body>
</html>
