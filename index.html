<!DOCTYPE html>
<html lang="bn" x-data="erpSystem()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BizPro v3.0 | Professional ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .active-nav { color: #4f46e5 !important; background: #f0f4ff; border-radius: 16px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">

    <!-- Loading Screen -->
    <div x-show="loading" class="fixed inset-0 z-[100] bg-white flex items-center justify-center">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 font-bold text-indigo-600 animate-pulse">BizPro লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="h-16 shrink-0 glass sticky top-0 z-40 px-5 flex items-center justify-between border-b">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-200">
                <i data-lucide="zap" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-800">BizPro <span class="text-xs font-normal text-indigo-500">v3.0</span></h1>
        </div>
        <button @click="syncData()" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
            <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-500" :class="loading && 'animate-spin'"></i>
        </button>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 overflow-y-auto custom-scroll pb-24 md:pb-8">
        
        <!-- Dashboard Tab -->
        <div x-show="tab === 'home'" class="p-5 space-y-6" x-transition>
            <!-- Stats Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-[2rem] border shadow-sm border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">আজকের বিক্রি</p>
                    <h2 class="text-2xl font-bold text-slate-800 mt-1">৳<span x-text="stats.dayTotal">0</span></h2>
                </div>
                <div class="bg-indigo-600 p-5 rounded-[2rem] text-white shadow-xl shadow-indigo-100">
                    <p class="text-xs font-semibold opacity-80 uppercase tracking-wider">আজকের লাভ</p>
                    <h2 class="text-2xl font-bold mt-1">৳<span x-text="stats.dayProfit">0</span></h2>
                </div>
                <div class="bg-white p-5 rounded-[2rem] border shadow-sm border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">মোট বাকি</p>
                    <h2 class="text-2xl font-bold text-rose-500 mt-1">৳<span x-text="stats.totalDue">0</span></h2>
                </div>
                <div class="bg-white p-5 rounded-[2rem] border shadow-sm border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">মোট আইটেম</p>
                    <h2 class="text-2xl font-bold text-slate-800 mt-1" x-text="products.length">0</h2>
                </div>
            </div>

            <!-- Stock Alerts -->
            <div class="space-y-4">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="alert-triangle" class="text-amber-500 w-5 h-5"></i> স্টক ফুরিয়ে যাচ্ছে
                </h3>
                <div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
                    <template x-for="p in products.filter(i => Number(i.Stock) < 10)">
                        <div class="shrink-0 w-40 bg-white p-4 rounded-3xl border border-rose-100 shadow-sm shadow-rose-50">
                            <p class="font-bold text-sm truncate" x-text="p.Name"></p>
                            <p class="text-xs text-rose-500 font-bold mt-1">স্টক: <span x-text="p.Stock"></span></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- POS Tab -->
        <div x-show="tab === 'pos'" class="p-5 space-y-4" x-transition>
            <div class="sticky top-0 z-30 bg-slate-50 py-2">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-3.5 text-slate-400 w-5 h-5"></i>
                    <input type="text" x-model="search" placeholder="পণ্যের নাম খুঁজুন..." 
                        class="w-full pl-12 pr-4 py-3.5 bg-white border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-indigo-500 transition outline-none text-sm font-medium">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <template x-for="p in filtered()">
                    <div @click="addToCart(p)" class="bg-white p-3 rounded-[1.5rem] border border-slate-100 hover:border-indigo-400 transition active:scale-95 shadow-sm">
                        <div class="h-20 bg-slate-50 rounded-2xl flex items-center justify-center mb-3 text-slate-300">
                            <i data-lucide="package" class="w-8 h-8"></i>
                        </div>
                        <h4 class="font-bold text-xs text-slate-700 truncate" x-text="p.Name"></h4>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-indigo-600 font-bold text-sm">৳<span x-text="p.SellPrice"></span></span>
                            <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 rounded-md text-slate-500 font-bold" x-text="p.Stock"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Customers Tab -->
        <div x-show="tab === 'customers'" class="p-5" x-transition>
            <div class="space-y-3">
                <template x-for="c in customers">
                    <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center font-bold">
                                <i data-lucide="user" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="font-bold text-sm" x-text="c.Name"></p>
                                <p class="text-[10px] text-slate-400" x-text="c.Phone"></p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-400">বাকি টাকা</p>
                            <p class="text-sm font-bold text-rose-500">৳<span x-text="c.CurrentDue"></span></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Floating Checkout Bar (Mobile) -->
    <div x-show="tab === 'pos' && cart.length > 0" class="fixed bottom-24 left-4 right-4 z-50 animate-bounce" x-transition>
        <button @click="showCart = true" class="w-full bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 px-2 py-1 rounded-lg text-xs font-bold" x-text="cart.length"></div>
                <span class="font-bold text-sm">আইটেম যোগ হয়েছে</span>
            </div>
            <span class="font-bold text-lg italic">মোট: ৳<span x-text="total()"></span> →</span>
        </button>
    </div>

    <!-- Cart Modal -->
    <div x-show="showCart" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-end justify-center" x-cloak>
        <div @click.away="showCart = false" class="bg-white w-full max-w-lg rounded-t-[2.5rem] p-6 space-y-6 shadow-2xl animate-slide-up">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">আপনার কার্ট</h3>
                <button @click="showCart = false" class="p-2 bg-slate-100 rounded-full text-slate-500"><i data-lucide="x"></i></button>
            </div>
            
            <div class="max-h-60 overflow-y-auto space-y-3 custom-scroll pr-2">
                <template x-for="(item, i) in cart">
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border">
                        <div class="flex-1">
                            <p class="font-bold text-sm" x-text="item.Name"></p>
                            <p class="text-xs text-indigo-600 font-bold">৳<span x-text="item.SellPrice"></span></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="item.qty > 1 ? item.qty-- : cart.splice(i, 1)" class="w-8 h-8 bg-white border rounded-xl flex items-center justify-center font-bold">-</button>
                            <span class="font-bold text-sm" x-text="item.qty"></span>
                            <button @click="item.qty++" class="w-8 h-8 bg-white border rounded-xl flex items-center justify-center font-bold">+</button>
                        </div>
                    </div>
                </template>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" x-model="sale.phone" placeholder="কাস্টমার ফোন" class="p-3 bg-slate-50 border rounded-xl outline-none text-sm font-medium focus:ring-2 focus:ring-indigo-500">
                    <input type="number" x-model="sale.paid" placeholder="জমা টাকা" class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl outline-none text-sm font-bold text-indigo-700">
                </div>
                <div class="flex justify-between items-center text-2xl font-bold">
                    <span>মোট:</span>
                    <span class="text-indigo-600">৳<span x-text="total()"></span></span>
                </div>
                <button @click="checkout()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-200 active:scale-95 transition">অর্ডার কনফার্ম করুন</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white/80 backdrop-blur-lg border-t flex justify-around items-center px-4 safe-bottom z-40">
        <button @click="tab = 'home'" :class="tab === 'home' && 'active-nav'" class="flex flex-col items-center gap-1 p-2 w-16 transition-all duration-300">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">হোম</span>
        </button>
        <button @click="tab = 'pos'" :class="tab === 'pos' && 'active-nav'" class="flex flex-col items-center gap-1 p-2 w-16 transition-all duration-300">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">বিক্রি</span>
        </button>
        <button @click="tab = 'customers'" :class="tab === 'customers' && 'active-nav'" class="flex flex-col items-center gap-1 p-2 w-16 transition-all duration-300">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">ক্রেতা</span>
        </button>
        <button @click="tab = 'settings'" :class="tab === 'settings' && 'active-nav'" class="flex flex-col items-center gap-1 p-2 w-16 transition-all duration-300">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold">সেটিংস</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6geARsr2R_HS2QdghcCaDO5XeT24N9fk05Hz6u8yOZwj_OH98UiCHf8FFvPmEQccStQ/exec"; // এখানে আপনার URL দিন

        function erpSystem() {
            return {
                tab: 'home',
                loading: false,
                search: '',
                showCart: false,
                products: [],
                customers: [],
                stats: { dayTotal: 0, dayProfit: 0, totalDue: 0 },
                cart: [],
                sale: { phone: '', paid: 0 },

                async init() {
                    lucide.createIcons();
                    await this.syncData();
                },

                async syncData() {
                    this.loading = true;
                    try {
                        const res = await fetch(`${API_URL}?action=sync`);
                        const data = await res.json();
                        this.products = data.products;
                        this.customers = data.customers;
                        this.stats = data.stats;
                        lucide.createIcons();
                    } catch (e) {
                        Swal.fire('Error', 'সার্ভারে কানেক্ট করা যাচ্ছে না!', 'error');
                    }
                    this.loading = false;
                },

                filtered() {
                    return this.products.filter(p => p.Name.toLowerCase().includes(this.search.toLowerCase()));
                },

                addToCart(p) {
                    let item = this.cart.find(i => i.Name === p.Name);
                    if (item) item.qty++;
                    else this.cart.push({ ...p, qty: 1 });
                    
                    // টোস্ট মেসেজ
                    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 });
                    Toast.fire({ icon: 'success', title: 'কার্টে যোগ হয়েছে' });
                },

                total() {
                    return this.cart.reduce((s, i) => s + (Number(i.SellPrice) * i.qty), 0);
                },

                async checkout() {
                    if (this.cart.length === 0 || !this.sale.phone) {
                        return Swal.fire('সতর্কতা', 'কার্ট খালি বা ফোন নম্বর নেই!', 'warning');
                    }

                    this.loading = true;
                    this.showCart = false;

                    try {
                        const res = await fetch(API_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                action: 'checkout',
                                data: {
                                    items: this.cart,
                                    customer: { Phone: this.sale.phone, Name: 'Customer' },
                                    total: this.total(),
                                    paid: this.sale.paid,
                                    due: this.total() - this.sale.paid
                                }
                            })
                        });
                        
                        const result = await res.json();
                        if (result.status === 'success') {
                            Swal.fire({
                                icon: 'success',
                                title: 'অর্ডার সম্পন্ন!',
                                text: 'ইনভয়েস ID: ' + result.invID,
                                confirmButtonText: 'ঠিক আছে'
                            });
                            this.cart = [];
                            this.sale = { phone: '', paid: 0 };
                            await this.syncData();
                        }
                    } catch (e) {
                        Swal.fire('Error', 'অর্ডার সেভ করা যায়নি!', 'error');
                    }
                    this.loading = false;
                }
            }
        }
    </script>
</body>
</html>
